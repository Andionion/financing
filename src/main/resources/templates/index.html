<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header :: commonHeader}">
    <title>财务管理平台</title>
</head>
<body>
<div class="container">
    <!-- 导航栏 -->
    <th:block th:replace="~{common/navbar :: navbar('index')}"></th:block>
</div>

<div class="container">
    <div class="row mt-3">
        <div class="col col-12 text-center">
            <h2>欢迎来到我的财务管理平台</h2>
            <p class="text-secondary">请选择您要查看的内容</p>
        </div>
    </div>

    <!-- 修改行布局为三列 -->
    <div class="row mt-3">
        <!-- 基金卡片 -->
        <div class="col col-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">基金</h5>
                    <a href="/financing/fund/trade" class="btn btn-primary">进入基金页面</a>
                </div>
            </div>
        </div>

        <!-- 黄金卡片 -->
        <div class="col col-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">黄金</h5>
                    <a href="/financing/gold/trade" class="btn btn-primary">进入黄金页面</a>
                </div>
            </div>
        </div>

        <!-- 新增的公积金卡片 -->
        <div class="col col-4">
            <div class="card">
                <div class="card-body text-center">
                    <h5 class="card-title">公积金</h5>
                    <a href="/financing/housing_provident_fund" class="btn btn-primary">进入公积金页面</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
        crossorigin="anonymous"></script>

<script>
    $(function () {
        $('.toast').toast('show');
    });
</script>
</body>
</html>
