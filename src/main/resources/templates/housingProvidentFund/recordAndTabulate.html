<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/header :: commonHeader}">
    <title>公积金记录展示和统计</title>
</head>

<body>
<div class="container">
    <!-- 导航栏 -->
    <th:block th:replace="~{common/navbar :: navbar('housing')}"></th:block>
</div>
<div class="container">
    <!-- 公积金统计 -->
    <div class="row mt-3">
        <div class="col col-12 text-center">
            <h2>公积金统计</h2>
            <p class="text-secondary">当前公积金账户统计概览</p>
        </div>
    </div>
    <table class="table table-bordered">
        <thead class="thead-light">
        <tr>
            <th>统计日</th>
            <th>总入账</th>
            <th>总提取</th>
            <th>总结息</th>
            <th>余额</th>
            <th>可贷款额度</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td class="fund-info-cell" th:text="${recordStatistics.currentDate}"></td>
            <td class="fund-info-cell" th:text="${recordStatistics.totalDeposit}"></td>
            <td class="fund-info-cell" th:text="${recordStatistics.totalWithdrawal}"></td>
            <td class="fund-info-cell" th:text="${recordStatistics.totalInterest}"></td>
            <td class="fund-info-cell" th:text="${recordStatistics.balance}"></td>
            <td class="fund-info-cell" th:text="${recordStatistics.loanAvailable}"></td>
        </tr>
        </tbody>
    </table>
</div>

<div class="container">
    <!-- 交易记录标题和按钮 -->
    <div class="header-section">
        <div class="row mt-3">
            <div class="col col-12 text-center">
                <h2>公积金记录明细展示
                    <button class="btn btn-primary" data-toggle="modal" data-target="#addRecordModal">
                        添加记录
                    </button>
                </h2>
                <p class="text-secondary">历史记录明细列表</p>
            </div>
        </div>
    </div>

    <!-- 明细表格 -->
    <table class="table table-bordered">
        <thead class="thead-light">
        <tr>
            <th>日期</th>
            <th>操作类型</th>
            <th>金额</th>
            <th>余额</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="record : ${recordStatistics.recordList}">
            <tr>
                <td class="fund-info-cell" th:text="${record.operationDate}"></td>
                <td class="fund-info-cell">
                     <span th:switch="${record.operationType}">
                        <span th:case="'deposit'">入账</span>
                        <span th:case="'withdrawal'">提取</span>
                        <span th:case="'interest'">结息</span>
                        <span th:case="*">未知类型</span>
                     </span>
                </td>
                <td class="fund-info-cell" th:text="${record.amount}"></td>
                <td class="fund-info-cell" th:text="${record.balance}"></td>
                <td class="fund-info-cell">
                    <button class="btn btn-sm btn-warning edit-btn"
                            th:data-id="${record.id}"
                            th:data-date="${record.operationDate}"
                            th:data-type="${record.operationType}"
                            th:data-amount="${record.amount}">
                        修改
                    </button>
                    <button class="btn btn-sm btn-danger delete-btn"
                            th:data-id="${record.id}">
                        删除
                    </button>
                </td>
            </tr>
        </th:block>
        </tbody>
    </table>

    <!-- 添加记录模态框 -->
    <div class="modal fade" id="addRecordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">添加公积金记录</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <form id="recordForm">
                    <div class="modal-body">
                        <!-- 修改后的日期选择器 -->
                        <div class="form-group">
                            <label for="operationDate">日期</label>
                            <input type="text"
                                   class="form-control flatpickr"
                                   id="operationDate"
                                   placeholder="选择日期"
                                   data-date-format="Y-m-d"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="operationType">操作类型</label>
                            <select class="form-control" id="operationType" required>
                                <option value="deposit">入账</option>
                                <option value="withdrawal">提取</option>
                                <option value="interest">结息</option>
                            </select>
                        </div>

                        <div id="purchaseFields">
                            <div class="form-group">
                                <label for="amount">金额</label>
                                <input type="number" step="0.01" class="form-control" id="amount">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary">提交记录</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- 修改记录模态框 -->
    <div class="modal fade" id="editRecordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">修改公积金记录</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <form id="editForm">
                    <div class="modal-body">
                        <input type="hidden" id="editId">
                        <div class="form-group">
                            <label for="editOperationDate">日期</label>
                            <input type="text" class="form-control flatpickr"
                                   id="editOperationDate" required>
                        </div>
                        <div class="form-group">
                            <label for="editOperationType">操作类型</label>
                            <select class="form-control" id="editOperationType" required>
                                <option value="deposit">入账</option>
                                <option value="withdrawal">提取</option>
                                <option value="interest">结息</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="editAmount">金额</label>
                            <input type="number" step="0.01"
                                   class="form-control" id="editAmount" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary">保存修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 依赖脚本 -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- 脚本 -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/zh.js"></script>

<script>
    $(document).ready(function () {
        // 共用日期选择器配置
        const flatpickrConfig = {
            locale: "zh",
            dateFormat: "Y-m-d",
            allowInput: true,
            theme: "airbnb"
        };

        // 初始化所有日期输入框
        flatpickr("#operationDate", flatpickrConfig);
        flatpickr("#editOperationDate", flatpickrConfig);

        // 表单提交处理
        $('#recordForm').submit(function (e) {
            e.preventDefault();

            // 构建JSON对象
            const formData = {
                operationDate: $('#operationDate').val(),
                operationType: $('#operationType').val(),
                amount: parseFloat($('#amount').val()),
            };

            // 发送AJAX请求
            $.ajax({
                url: '/financing/housing_provident_fund/add',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function () {
                    $('#addRecordModal').modal('hide');
                    location.reload(); // 刷新页面更新数据
                },
                error: function (xhr) {
                    alert('错误: ' + (xhr.responseJSON?.message || '请求失败'));
                }
            });
        });

        // 使用document代替body（事件委托标准做法）
        const $doc = $(document);

        // 修改按钮点击事件
        $doc.on('click', '.edit-btn', function () {
            const $btn = $(this);
            $('#editId').val($btn.data('id'));
            $('#editOperationDate').val($btn.data('date'));
            $('#editOperationType').val($btn.data('type'));
            $('#editAmount').val($btn.data('amount'));
            $('#editRecordModal').modal('show');
        });

        // 修改表单提交
        $('#editForm').submit(function (e) {
            e.preventDefault();

            const formData = {
                id: $('#editId').val(),
                operationDate: $('#editOperationDate').val(),
                operationType: $('#editOperationType').val(),
                amount: parseFloat($('#editAmount').val())
            };

            $.ajax({
                url: '/financing/housing_provident_fund/update',
                type: 'POST', // 或 POST 根据后端接口
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function () {
                    $('#editRecordModal').modal('hide');
                    location.reload();
                },
                error: function (xhr) {
                    alert('错误: ' + (xhr.responseJSON?.message || '修改失败'));
                }
            });
        });

        // 删除按钮点击事件
        $doc.on('click', '.delete-btn', function () {
            if (!confirm('确定要删除这条记录吗？')) return;

            const recordId = $(this).data('id');
            $.ajax({
                url: '/financing/housing_provident_fund/delete',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({id: recordId}),
                success: function () {
                    location.reload();
                },
                error: function (xhr) {
                    alert('错误: ' + (xhr.responseJSON?.message || '删除失败'));
                }
            });
        });
    });
</script>

</body>
</html>
