<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header :: commonHeader}">
    <title>基金详细交易</title>
</head>
<body>
<div class="container">
    <!-- 导航栏 -->
    <th:block th:replace="~{common/navbar :: navbar('fund')}"></th:block>
</div>

<div class="container">
    <div class="row mt-3">
        <div class="col col-12 text-center">
            <h2 th:text="${belong} + '的' + ${fundName} + '(' + ${fundCode} + ')详细交易记录'"></h2>
            <p class="text-secondary">交易记录详情展示</p>
        </div>
    </div>
    <table class="table table-bordered">
        <thead class="thead-light">
        <tr>
            <th>交易日期</th>
            <th>交易类型</th>
            <th>交易金额</th>
            <th>交易份额</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="fundTrade : ${fundTradeList}">
            <tr>
                <td th:text="${fundTrade.tradeDate}"></td>
                <td th:text="${fundTrade.tradeType == 'purchase' ? '申购' : '赎回'}"></td>
                <td th:text="${fundTrade.amount}"></td>
                <td th:text="${fundTrade.share}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>
</div>

<!-- 引入jQuery -->
<script src="https://cdn.jsdelivr.net/npm/jquery@1.11.1/dist/jquery.min.js"></script>
<!-- 引入Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
