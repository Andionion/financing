<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>基金详细交易</title>
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- 引用外部CSS文件 -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h2 class="text-center mb-4" th:text="${belong}+'的'+${fundName}(${fundCode})+'基金详细交易记录'">基金详细交易</h2>
    <table>
        <thead>
        <tr>
            <th>交易日期</th>
            <th>交易类型</th>
            <th>交易金额</th>
            <th>交易份额</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="fundTrade : ${fundTradeList}">
            <tr>
                <td th:text="${fundTrade.tradeDate}"></td>
                <td th:text="${fundTrade.tradeType == 'purchase' ? '申购' : '赎回'}"></td>
                <td th:text="${fundTrade.amount}"></td>
                <td th:text="${fundTrade.share}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>
</div>

<!-- 引入jQuery -->
<script src="https://cdn.jsdelivr.net/npm/jquery@1.11.1/dist/jquery.min.js"></script>
<!-- 引入Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
