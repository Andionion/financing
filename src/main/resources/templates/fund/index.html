<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/header :: commonHeader}">
    <title>基金交易统计数据展示</title>
</head>
<body>
<div class="container">
    <!-- 导航栏 -->
    <th:block th:replace="~{common/navbar :: navbar('fund')}"></th:block>
</div>

<div class="container">
    <div class="row mt-3">
        <div class="col col-12 text-center">
            <h2>基金交易所属人</h2>
            <p class="text-secondary">请选择交易所属人</p>
        </div>
    </div>
    <div class="row row-cols-auto g-4 justify-content-center">
        <div class="col" th:each="belong : ${belongs}">
            <div class="belong-item" th:data-name="${belong}">
                <div class="belong-content">
                    <span class="belong-icon">🏦</span>
                    <h3 class="belong-title" th:text="${belong}"></h3>
                    <div class="hover-indicator"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="row mt-3">
        <div class="col col-12 text-center">
            <h2>新增交易记录</h2>
        </div>
    </div>
    <div class="row">
        <form id="transactionForm">
            <div class="form-group">
                <label for="fundCode">基金代码</label>
                <input type="text" class="form-control" id="fundCode" placeholder="请输入基金代码" required>
            </div>
            <div class="form-group">
                <label for="belong">所属</label>
                <select class="form-control" id="belong" required>
                    <option value="">请选择所属</option>
                    <option th:each="name : ${belongs}" th:value="${name}" th:text="${name}"></option>
                </select>
            </div>
            <!-- 新增的下拉框 -->
            <div class="form-group">
                <label for="tradeType">交易类型</label>
                <select class="form-control" id="tradeType" required>
                    <option value="">请选择交易类型</option>
                    <option value="purchase" selected>申购</option>
                    <option value="redeem">赎回</option>
                </select>
            </div>
            <!-- 修改后的日期选择器 -->
            <div class="form-group">
                <label for="tradeDate">交易日期</label>
                <input type="text"
                       class="form-control flatpickr"
                       id="tradeDate"
                       placeholder="选择日期"
                       data-date-format="Y-m-d"
                       required>
            </div>
            <div class="form-group">
                <label for="amount">金额</label>
                <input type="number" step="0.01" class="form-control" id="amount" placeholder="请输入金额" required>
            </div>
            <div class="form-group">
                <label for="share">份额</label>
                <input type="number" step="0.01" class="form-control" id="share" placeholder="请输入份额" required>
            </div>
            <button type="submit" class="btn-submit">提交</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.11.1/dist/jquery.min.js"></script>

<script>
    $(function () {
        $(".belong-item").click(function () {
            const name = $(this).attr('data-name');
            window.location.href = '/financing/fund/trade/tabulate/' + encodeURIComponent(name);
        });
        // 初始化日期选择器
        flatpickr("#tradeDate", {
            locale: "zh",           // 中文显示
            dateFormat: "Y-m-d",     // 日期格式
            allowInput: true,        // 允许手动输入
            theme: "airbnb"  // Airbnb 风格
        });
        // 设置交易类型下拉框默认值
        $("#tradeType").val("purchase");

        // 表单提交事件
        $("#transactionForm").submit(function (event) {
            event.preventDefault();

            // 获取表单数据
            const fundCode = $("#fundCode").val();
            const belong = $("#belong").val();
            const tradeDate = $("#tradeDate").val(); // 直接获取 flatpickr 的值
            const amount = parseFloat($("#amount").val());
            const share = parseFloat($("#share").val());
            const tradeType = $("#tradeType").val(); // 获取下拉框选中的值

            // 校验交易类型是否为空
            if (!tradeType) {
                alert("请选择交易类型！");
                return;
            }

            // 构建请求体
            const requestBody = {
                fundCode: fundCode,
                belong: belong,
                tradeDate: tradeDate,
                amount: amount,
                share: share,
                tradeType: tradeType
            };

            // 发送 AJAX 请求
            $.ajax({
                url: '/financing/fund/trade/add',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(requestBody),
                success: function (response) {
                    alert("交易记录提交成功！");
                    $("#transactionForm")[0].reset(); // 重置表单
                },
                error: function (xhr, status, error) {
                    alert("交易记录提交失败，请重试。");
                }
            });
        });

    });
</script>

</body>
</html>
