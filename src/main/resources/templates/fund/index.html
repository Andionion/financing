<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>基金交易统计数据展示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css"
          integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <!-- 引用外部CSS文件 -->
    <link rel="stylesheet" href="/css/styles.css">
    <!-- flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <!-- flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body>

<div class="container">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                <li class="nav-item active"><a class="nav-link" href="/financing/fund/trade">基金</a></li>
                <li class="nav-item"><a class="nav-link" href="/financing/gold/trade">黄金</a></li>
                <li class="nav-item"><a class="nav-link" href="/financing/housing_provident_fund">公积金</a></li>
            </ul>
        </div>
    </nav>
</div>

<div class="container">
    <div class="row">
        <h1 class="text-center mb-4">基金交易所属人</h1>
        <div class="col col-3" th:each="belong : ${belongs}">
            <div class="card h-100" th:data-name="${belong}">
                <div class="card-body">
                    <h1 class="card-title" th:text="${belong}"></h1>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container">
    <div class="row">
        <h1 class="text-center mb-4">新增交易记录</h1>
        <form id="transactionForm">
            <div class="form-group">
                <label for="fundCode">基金代码</label>
                <input type="text" class="form-control" id="fundCode" placeholder="请输入基金代码" required>
            </div>
            <div class="form-group">
                <label for="belong">所属</label>
                <select class="form-control" id="belong" required>
                    <option value="">请选择所属</option>
                    <option th:each="name : ${belongs}" th:value="${name}" th:text="${name}"></option>
                </select>
            </div>
            <!-- 新增的下拉框 -->
            <div class="form-group">
                <label for="tradeType">交易类型</label>
                <select class="form-control" id="tradeType" required>
                    <option value="">请选择交易类型</option>
                    <option value="purchase" selected>申购</option>
                    <option value="redeem">赎回</option>
                </select>
            </div>
            <!-- 修改后的日期选择器 -->
            <div class="form-group">
                <label for="tradeDate">交易日期</label>
                <input type="text"
                       class="form-control flatpickr"
                       id="tradeDate"
                       placeholder="选择日期"
                       data-date-format="Y-m-d"
                       required>
            </div>
            <div class="form-group">
                <label for="amount">金额</label>
                <input type="number" step="0.01" class="form-control" id="amount" placeholder="请输入金额" required>
            </div>
            <div class="form-group">
                <label for="share">份额</label>
                <input type="number" step="0.01" class="form-control" id="share" placeholder="请输入份额" required>
            </div>
            <button type="submit" class="btn-submit">提交</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@1.11.1/dist/jquery.min.js"></script>

<script>
    $(function () {
        $(".card").click(function () {
            const name = $(this).attr('data-name');
            window.location.href = '/financing/fund/trade/tabulate/' + encodeURIComponent(name);
        });
        // 初始化日期选择器
        flatpickr("#tradeDate", {
            locale: "zh",           // 中文显示
            dateFormat: "Y-m-d",     // 日期格式
            allowInput: true,        // 允许手动输入
            theme: "airbnb"  // Airbnb 风格
        });
        // 设置交易类型下拉框默认值
        $("#tradeType").val("purchase");

        // 表单提交事件
        $("#transactionForm").submit(function (event) {
            event.preventDefault();

            // 获取表单数据
            const fundCode = $("#fundCode").val();
            const belong = $("#belong").val();
            const tradeDate = $("#tradeDate").val(); // 直接获取 flatpickr 的值
            const amount = parseFloat($("#amount").val());
            const share = parseFloat($("#share").val());
            const tradeType = $("#tradeType").val(); // 获取下拉框选中的值

            // 校验交易类型是否为空
            if (!tradeType) {
                alert("请选择交易类型！");
                return;
            }

            // 构建请求体
            const requestBody = {
                fundCode: fundCode,
                belong: belong,
                tradeDate: tradeDate,
                amount: amount,
                share: share,
                tradeType: tradeType
            };

            // 发送 AJAX 请求
            $.ajax({
                url: '/financing/fund/trade/add',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(requestBody),
                success: function (response) {
                    alert("交易记录提交成功！");
                    $("#transactionForm")[0].reset(); // 重置表单
                },
                error: function (xhr, status, error) {
                    alert("交易记录提交失败，请重试。");
                }
            });
        });

    });
</script>

</body>
</html>
