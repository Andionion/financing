<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>黄金交易数据展示</title>
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css"
          integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <!-- 引入Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- 引用外部CSS文件 -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="container">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">首页 <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/financing/fund/trade">基金</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="/financing/gold/trade">黄金</a>
                </li>
            </ul>
        </div>
    </nav>
</div>

<div class="container">
    <h1 class="text-center mb-4">黄金统计</h1>
    <table>
        <thead>
        <tr>
            <th>总克数</th>
            <th>纸面金克数</th>
            <th>实体金克数</th>
            <th>当前金价</th>
            <th>现值</th>
            <th>净投入</th>
            <th>收益</th>
            <th>收益率</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td class="fund-info-cell" th:text="${goldStatistics.totalWeight}"></td>
            <td class="fund-info-cell" th:text="${goldStatistics.paperGoldWeight}"></td>
            <td class="fund-info-cell" th:text="${goldStatistics.physicalGoldWeight}"></td>
            <td class="fund-info-cell" th:text="${goldStatistics.currentUnitPrice}"></td>
            <td class="fund-info-cell" th:text="${goldStatistics.presentValue}"></td>
            <td class="fund-info-cell" th:text="${goldStatistics.netInvestment}"></td>
            <td class="profit-yield-cell"
                th:classappend="${goldStatistics.profit >= 0 ? 'positive' : 'negative'}"
                th:text="${goldStatistics.profit}"></td>
            <td class="profit-yield-cell"
                th:classappend="${goldStatistics.yield.startsWith('-')? 'negative' : 'positive'}"
                th:text="${goldStatistics.yield}"></td>
        </tr>
        </tbody>
    </table>
</div>

<div class="container">
    <h1 class="text-center mb-4">黄金交易数据展示</h1>
    <table>
        <thead>
        <tr>
            <th>日期</th>
            <th>金额</th>
            <th>单价</th>
            <th>克数</th>
            <th>交易类型</th>
            <th>黄金类型</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="trade : ${goldStatistics.tradeDetailList}">
            <tr>
                <td class="fund-info-cell" th:text="${trade.tradeTime}"></td>
                <td class="fund-info-cell" th:text="${trade.amount}"></td>
                <td class="fund-info-cell" th:text="${trade.unitPrice}"></td>
                <td class="fund-info-cell" th:text="${trade.weight}"></td>
                <td th:text="${trade.tradeType == 'purchase' ? '申购' : '赎回'}"></td>
                <td th:text="${trade.goldType == 'paper' ? '纸面金' : '实体金'}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>
</div>

<!-- 引入jQuery -->
<script src="https://cdn.jsdelivr.net/npm/jquery@1.11.1/dist/jquery.min.js"></script>
<!-- 引入Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
