<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>黄金交易数据展示</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap 4 CSS（确保模态框兼容性） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css">
    <!-- 引用外部CSS文件 -->
    <link rel="stylesheet" href="/css/styles.css">
    <!-- 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

<div class="container">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/financing/fund/trade">基金</a></li>
                <li class="nav-item active"><a class="nav-link" href="/financing/gold/trade">黄金</a></li>
            </ul>
        </div>
    </nav>

    <!-- 黄金统计 -->
    <h1 class="text-center mb-4">黄金统计</h1>
    <table class="table table-bordered">
        <thead class="thead-light">
        <tr>
            <th>总克数</th>
            <th>纸面金克数</th>
            <th>实体金克数</th>
            <th>当前金价</th>
            <th>现值</th>
            <th>净投入</th>
            <th>收益</th>
            <th>收益率</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td class="fund-info-cell" th:text="${goldStatistics.totalWeight}"></td>
            <td class="fund-info-cell" th:text="${goldStatistics.paperGoldWeight}"></td>
            <td class="fund-info-cell" th:text="${goldStatistics.physicalGoldWeight}"></td>
            <td class="fund-info-cell" th:text="${goldStatistics.currentUnitPrice}"></td>
            <td class="fund-info-cell" th:text="${goldStatistics.presentValue}"></td>
            <td class="fund-info-cell" th:text="${goldStatistics.netInvestment}"></td>
            <td class="profit-yield-cell"
                th:classappend="${goldStatistics.profit >= 0 ? 'positive' : 'negative'}"
                th:text="${goldStatistics.profit}"></td>
            <td class="profit-yield-cell"
                th:classappend="${goldStatistics.yield.startsWith('-')? 'negative' : 'positive'}"
                th:text="${goldStatistics.yield}"></td>
        </tr>
        </tbody>
    </table>

    <!-- 交易记录标题和按钮 -->
    <div class="header-section">
        <h1 class="text-center mb-4">黄金交易数据展示
            <button class="btn btn-primary" data-toggle="modal" data-target="#addTradeModal">
                添加交易记录
            </button>
        </h1>
    </div>

    <!-- 交易记录表格 -->
    <table class="table table-bordered">
        <thead class="thead-light">
        <tr>
            <th>日期</th>
            <th>金额</th>
            <th>单价</th>
            <th>克数</th>
            <th>交易类型</th>
            <th>黄金类型</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="trade : ${goldStatistics.tradeDetailList}">
            <tr>
                <td class="fund-info-cell" th:text="${trade.tradeTime}"></td>
                <td class="fund-info-cell" th:text="${trade.amount}"></td>
                <td class="fund-info-cell" th:text="${trade.unitPrice}"></td>
                <td class="fund-info-cell" th:text="${trade.weight}"></td>
                <td th:text="${trade.tradeType == 'purchase' ? '申购' : '赎回'}"></td>
                <td th:text="${trade.goldType == 'paper' ? '纸面金' : '实体金'}"></td>
            </tr>
        </th:block>
        </tbody>
    </table>

    <!-- 添加交易记录模态框 -->
    <div class="modal fade" id="addTradeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">添加交易记录</h5>
                    <button type="button" class="close" data-dismiss="modal">
                        <span>&times;</span>
                    </button>
                </div>
                <form id="tradeForm">
                    <div class="modal-body">
                        <!-- 修改后的日期选择器 -->
                        <div class="form-group">
                            <label for="tradeTime">交易日期</label>
                            <input type="text"
                                   class="form-control flatpickr"
                                   id="tradeTime"
                                   placeholder="选择日期"
                                   data-date-format="Y-m-d"
                                   required>
                        </div>

                        <div class="form-group">
                            <label for="goldType">黄金类型</label>
                            <select class="form-control" id="goldType" required>
                                <option value="paper">纸面金</option>
                                <option value="physical">实体金</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="tradeType">交易类型</label>
                            <select class="form-control" id="tradeType" required>
                                <option value="purchase">买入</option>
                                <option value="redeem">卖出</option>
                            </select>
                        </div>

                        <div id="purchaseFields">
                            <div class="form-group">
                                <label for="amount">买入金额</label>
                                <input type="number" step="0.01" class="form-control" id="amount">
                            </div>
                        </div>

                        <div id="redeemFields" style="display: none;">
                            <div class="form-group">
                                <label for="weight">卖出克数</label>
                                <input type="number" step="0.01" class="form-control" id="weight">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="unitPrice">单价（元/克）</label>
                            <input type="number" step="0.01" class="form-control" id="unitPrice" required>
                        </div>

                        <div class="form-group">
                            <label for="rate">费率（%）</label>
                            <input type="number" step="0.0001" class="form-control" id="rate" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary">提交记录</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- 依赖脚本 -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- 脚本 -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/zh.js"></script>

<script>
    // 初始化日期选择器
    flatpickr("#tradeTime", {
        locale: "zh",           // 中文显示
        dateFormat: "Y-m-d",     // 日期格式
        allowInput: true,        // 允许手动输入
        theme: "airbnb"  // Airbnb 风格
    });
    $(document).ready(function () {
        // 交易类型切换逻辑
        $('#tradeType').change(function () {
            const type = $(this).val();
            $('#purchaseFields, #redeemFields').hide().find('input').prop('required', false);

            if (type === 'purchase') {
                $('#purchaseFields').show().find('input').prop('required', true);
            } else {
                $('#redeemFields').show().find('input').prop('required', true);
            }
        });

        // 表单提交处理
        $('#tradeForm').submit(function (e) {
            e.preventDefault();

            // 构建JSON对象
            const formData = {
                tradeTime: $('#tradeTime').val(),
                goldType: $('#goldType').val(),
                tradeType: $('#tradeType').val(),
                unitPrice: parseFloat($('#unitPrice').val()),
                rate: parseFloat($('#rate').val())
            };

            // 根据交易类型添加字段
            if (formData.tradeType === 'purchase') {
                formData.amount = parseFloat($('#amount').val());
            } else {
                formData.weight = parseFloat($('#weight').val());
            }

            // 发送AJAX请求
            $.ajax({
                url: '/financing/gold/trade/add',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function () {
                    alert('添加成功');
                    $('#addTradeModal').modal('hide');
                    location.reload(); // 刷新页面更新数据
                },
                error: function (xhr) {
                    alert('错误: ' + (xhr.responseJSON?.message || '请求失败'));
                }
            });
        });
    });
</script>

</body>
</html>
